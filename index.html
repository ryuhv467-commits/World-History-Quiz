<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Tempat Bersejarah Dunia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Kuis Tempat Bersejarah Dunia 🌍</h1>

  <!-- Halaman Login -->
  <section id="login" class="active">
    <h2>Masukkan Nama dan Pilih Level</h2>
    <input type="text" id="username" placeholder="Masukkan nama kamu"><br>
    <select id="level">
      <option value="">-- Pilih Level --</option>
      <option value="mudah">Mudah</option>
      <option value="sedang">Sedang</option>
      <option value="sulit">Sulit</option>
    </select><br>
    <button id="btnMulai">Mulai</button>
  </section>

  <!-- Halaman Kuis -->
  <section id="kuis">
    <h2>Selamat Datang, <span id="namaPlayer"></span>!</h2>
    <p>Level: <span id="levelGame"></span></p>
    <p>Nyawa ❤️: <span id="nyawa">3</span> | Poin 💎: <span id="poin">0</span> | Waktu ⏰: <span id="waktu">120</span> detik</p>
    <p id="status"></p>
    <img id="gambarSoal" src="" alt="Soal Gambar">
    <br>
    <input type="text" id="jawaban" placeholder="Tebak nama tempat..."><br>
    <button id="btnJawab">Jawab</button>
    <p id="hasil"></p>
  </section>

  <!-- Halaman Selesai -->
  <section id="selesai">
    <h2>Kuis Selesai!</h2>
    <p id="skorAkhir"></p>
    <button id="btnUlang">Main Lagi</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
