<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Tempat Bersejarah Dunia 🌍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <section id="login-section" class="active">
    <h1>Kuis Tempat Bersejarah Dunia 🌍</h1>
    <p>Masukkan Nama dan Pilih Level</p>
    <input type="text" id="username" placeholder="Nama Kamu">
    <select id="level">
      <option value="">-- Pilih Level --</option>
      <option value="mudah">Mudah</option>
      <option value="sedang">Sedang</option>
      <option value="sulit">Sulit</option>
    </select>
    <button id="startBtn">Mulai</button>
  </section>

  <!-- ================= KUIS ================= -->
  <section id="quiz-section" style="display: none;">
    <h2 id="playerInfo"></h2>
    <p id="timer">02:00</p>
    <p id="lives">❤️ 3</p>
    <p id="score">Skor: 0</p>

    <img id="question-image" src="" alt="Soal Gambar" width="300">
    <div id="options"></div>
  </section>

  <!-- ================= HASIL ================= -->
  <section id="result-section" style="display: none;">
    <h2>Hasil Kuis 🎉</h2>
    <p id="result-text"></p>
    <button id="restartBtn">Main Lagi</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
